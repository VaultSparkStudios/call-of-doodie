name: Deploy Supabase Function

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 · Node 24

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 · Node 24 composite
        with:
          version: 2.109.1

      - name: Validate deploy secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF."
            exit 1
          fi

      - name: Deploy issue-run-token function
        run: supabase functions deploy issue-run-token --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy submit-score function
        run: supabase functions deploy submit-score --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy kofi-webhook function
        run: supabase functions deploy kofi-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy sync-studio-events function
        run: supabase functions deploy sync-studio-events --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy validate-replay function
        run: supabase functions deploy validate-replay --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
